<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Moonlander 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --bg: #070a13;
    --panel: rgba(14, 19, 33, 0.94);
    --line: #26304a;
    --text: #e6e3dc;
    --muted: #9097a3;
    --accent: #7aa7ff;
    --danger: #e0645a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Helvetica Neue", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; flex-wrap: wrap;
    gap: 8px 16px; align-items: center; pointer-events: none; }
  header > * { pointer-events: auto; }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .01em; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  #tabs button { background: #111829; color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer; }
  #tabs button:hover { color: var(--text); }
  #tabs button[aria-pressed="true"] { background: #22314f; color: var(--text); border-color: var(--accent); }
  #tabs kbd { font: 11px ui-monospace, monospace; opacity: .6; margin-right: 5px; }
  #status { position: fixed; bottom: 10px; right: 16px; color: var(--muted); font-size: 12px; }
  #banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); max-width: min(680px, calc(100% - 32px));
    background: #3a1d1c; border: 1px solid var(--danger); color: #ffd9d4; padding: 10px 14px; border-radius: 8px;
    white-space: pre-wrap; z-index: 10; }
  #legend { position: fixed; left: 16px; bottom: 10px; display: grid; grid-template-columns: repeat(2, auto);
    gap: 3px 14px; font-size: 12px; color: var(--muted); background: rgba(7, 10, 19, .72); padding: 8px 10px;
    border-radius: 8px; }
  #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; vertical-align: -1px; background: var(--c);
    box-shadow: 0 0 6px var(--c); }
  #legend .ghost::before { box-shadow: none; opacity: .6; }
  #panel { position: fixed; top: 64px; right: 16px; width: 320px; max-height: calc(100% - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; z-index: 5; }
  #panel h2 { margin: 0 28px 2px 0; font-size: 22px; }
  #panel .title { color: var(--text); margin-bottom: 6px; }
  #panel .detail { color: var(--muted); margin-bottom: 10px; }
  #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0 0 12px; font-size: 13px; }
  #panel dt { color: var(--muted); }
  #panel dd { margin: 0; overflow-wrap: anywhere; }
  #panel code { font: 12px ui-monospace, monospace; background: #0b1120; padding: 1px 5px; border-radius: 4px; }
  #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  #panel ol { list-style: none; margin: 0; padding: 0; }
  #panel li { padding: 4px 6px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  #panel li:hover { background: #1a2338; }
  #panel li.current { background: #22314f; }
  #panel li .layer { color: var(--muted); min-width: 92px; font-size: 12px; }
  #panel li .via { color: var(--muted); font-size: 12px; }
  #panel li .dim { opacity: .55; }
  #close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted);
    font-size: 20px; cursor: pointer; }
  @media (max-width: 800px) {
    #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 55%; border-radius: 10px 10px 0 0; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<header>
  <h1>Moonlander</h1>
  <nav id="tabs" aria-label="Layer"></nav>
</header>
<div id="banner" hidden></div>
<aside id="panel" hidden></aside>
<div id="legend"></div>
<div id="status">Lade keymap.c …</div>
<script>
  // Visible error instead of a blank page if a module (e.g. keymap.js) fails to load or throws.
  function showError(msg) {
    const b = document.getElementById('banner');
    b.textContent = msg;
    b.hidden = false;
  }
  addEventListener('error', (e) => showError('Fehler: ' + (e.message || e.target?.src || 'unbekannt')), true);
  addEventListener('unhandledrejection', (e) => showError('Fehler: ' + (e.reason?.message || e.reason)));
</script>
<script type="module" src="main.js" onerror="showError('main.js oder eine Abhängigkeit (keymap.js, three.js) konnte nicht geladen werden.')"></script>
</body>
</html>
